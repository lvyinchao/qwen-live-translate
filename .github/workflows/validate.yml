name: Validate release candidate
on:
  workflow_call:
    inputs:
      expected-tag:
        description: Optional version tag that must match package.json
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HEADLESS: '1'
      EXPECTED_TAG: ${{ inputs.expected-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Match release version
        if: inputs.expected-tag != ''
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v'+JSON.parse(fs.readFileSync('package.json')).version !== process.env.EXPECTED_TAG) throw Error('Tag/package version mismatch');"
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run verify:media-source
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install offline-browser prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npx playwright install --with-deps chromium
      - name: All offline browser gates
        run: npm run test:browser
      - run: npm run package
      - run: npm run verify:release
      - name: Download, extract, install and verify the clean source ZIP
        run: npm run test:release
      - name: Preserve isolated source-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-source-failure-diagnostics
          path: |
            work/release-smoke-*/source-*.log
            outputs/release-smoke-verification.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-packages
          path: |
            outputs/timbradub-*-chrome.zip
            outputs/timbradub-*-webstore.zip
            outputs/timbradub-*-source.zip
            outputs/SHA256SUMS.txt
            outputs/release-smoke-verification.json
          if-no-files-found: error
          retention-days: 14
