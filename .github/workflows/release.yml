name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      expected-tag: ${{ github.ref_name }}
    permissions:
      contents: read
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-packages
          path: outputs
      - name: Recheck the validated artifacts
        working-directory: outputs
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Publish the exact validated packages
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::A release with this tag already exists. Published assets are not overwritten; use a new version.'
            exit 1
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          Open-source preview. See README for site compatibility and remaining validation limits.

          Download the `-chrome.zip`, extract it fully, then load the extracted root folder containing `manifest.json` in chrome://extensions. From v0.2.2 there is no additional extension subfolder. The `-webstore.zip` is the separate developer-dashboard upload; the `-source.zip` is for development. Bilingual installation instructions and SHA-256 checksums are included.

          Requires your own account and API key from https://qianwenai.com/. Model usage is billed to that account. Chrome Store availability is tracked independently in docs/store/STATUS.md.

          The attached packages passed the shared validation workflow, all offline browser gates, actual ZIP download/extract/load checks, and npm ci/build/browser checks from the clean source ZIP. These checks do not establish real-site translation quality, voice similarity or 20-minute synchronization acceptance.
          NOTES
          gh release create "$RELEASE_TAG" outputs/timbradub-*.zip outputs/SHA256SUMS.txt outputs/release-smoke-verification.json --verify-tag --title "$RELEASE_TAG · Open-source preview" --notes-file /tmp/release-notes.md --latest
